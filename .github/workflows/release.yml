name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: build ${{ matrix.target }}-${{ matrix.goarch }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14        # Apple Silicon
            target: macos
            goarch: arm64
          - os: macos-13        # Intel
            target: macos
            goarch: amd64
          - os: ubuntu-latest   # x86_64
            target: linux
            goarch: amd64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      # getlantern/systray uses CGO (Cocoa on macOS, GTK + AppIndicator on
      # Linux), so we build natively per OS/arch — no cross-compilation.
      - name: Install Linux build deps
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc libgtk-3-dev libayatana-appindicator3-dev

      - name: Resolve version
        id: ver
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build
        env:
          CGO_ENABLED: 1
        run: go build -ldflags "-s -w" -o portman ./cmd/portman

      - name: Package (macOS)
        if: matrix.target == 'macos'
        run: bash build/macos/make-bundle.sh ./portman "${{ steps.ver.outputs.version }}"

      - name: Package (Linux)
        if: matrix.target == 'linux'
        run: |
          mkdir -p dist/portman
          cp portman assets/icon.png build/linux/portman.desktop build/linux/install.sh dist/portman/
          chmod +x dist/portman/install.sh
          ( cd dist && tar czf portman-linux-amd64.tar.gz portman )

      - uses: actions/upload-artifact@v4
        with:
          name: portman-${{ matrix.target }}-${{ matrix.goarch }}
          path: |
            dist/*.zip
            dist/*.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
