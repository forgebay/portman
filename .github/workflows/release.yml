name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Build BOTH macOS architectures on a single Apple Silicon runner. amd64 is
  # cross-compiled with `clang -arch x86_64` (the macOS SDK is universal), so we
  # avoid the scarce/slow macos-13 Intel runner entirely.
  macos:
    runs-on: macos-14
    env:
      HAS_SIGNING: ${{ secrets.APPLE_CERT_P12_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Resolve version
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build (arm64 native + amd64 cross)
        run: |
          CGO_ENABLED=1 go build -ldflags "-s -w" -o portman-arm64 ./cmd/portman
          CGO_ENABLED=1 GOARCH=amd64 \
            CC="clang -arch x86_64" CXX="clang++ -arch x86_64" \
            go build -ldflags "-s -w" -o portman-amd64 ./cmd/portman

      - name: Stage raw binaries + bundle .app (per arch)
        env:
          APPLE_CERT_P12_BASE64: ${{ secrets.APPLE_CERT_P12_BASE64 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          mkdir -p dist
          for arch in arm64 amd64; do
            cp "portman-$arch" "dist/portman-darwin-$arch"
            bash build/macos/make-bundle.sh "./portman-$arch" "${{ steps.ver.outputs.version }}" "$arch"
            if [ "$HAS_SIGNING" = "true" ]; then
              bash build/macos/sign-notarize.sh "dist/Port Manager.app"
              rm -f "dist/PortManager-macos-$arch.zip"
              ( cd dist && ditto -c -k --keepParent "Port Manager.app" "PortManager-macos-$arch.zip" )
            fi
          done
          # Drop the unpacked .app so its internals aren't flattened into the
          # release as stray assets (icon.icns / Info.plist / portman).
          rm -rf "dist/Port Manager.app"

      - uses: actions/upload-artifact@v4
        with:
          name: dist-macos
          path: dist/*

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc libgtk-3-dev libayatana-appindicator3-dev

      - name: Build
        env:
          CGO_ENABLED: 1
        run: go build -ldflags "-s -w" -o portman ./cmd/portman

      - name: Stage raw binary + tarball
        run: |
          mkdir -p dist/portman
          cp portman "dist/portman-linux-amd64"
          cp portman assets/icon.png build/linux/portman.desktop build/linux/install.sh dist/portman/
          chmod +x dist/portman/install.sh
          ( cd dist && tar czf portman-linux-amd64.tar.gz portman && rm -rf portman )

      - uses: actions/upload-artifact@v4
        with:
          name: dist-linux
          path: dist/*

  release:
    needs: [macos, linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Flatten + checksums
        run: |
          mkdir -p release
          find artifacts -type f -exec cp {} release/ \;
          ( cd release && sha256sum * > checksums.txt )
          ls -la release
      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true

  # Publish to npm only after the release job has uploaded the assets: the
  # package's postinstall downloads the binary from the release, so publishing
  # first would ship a version that nobody can actually install.
  npm:
    needs: [release]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: read
      id-token: write # required for npm provenance
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      # postinstall resolves the release by the package version, so a mismatch
      # here would publish a package that looks for a tag that does not exist.
      - name: Refuse to publish when package.json disagrees with the tag
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          echo "tag=$tag package.json=$pkg"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::tag v$tag but package.json says $pkg — bump package.json before tagging"
            exit 1
          fi

      - name: Warn when the npm token is missing
        if: env.NPM_TOKEN == ''
        run: echo "::warning::NPM_TOKEN is not set, skipping the npm publish"

      # --provenance signs an attestation linking this tarball to this workflow
      # run, so consumers can verify the package was built from this repo.
      - name: Publish
        if: env.NPM_TOKEN != ''
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
