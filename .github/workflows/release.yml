name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: build ${{ matrix.target }}-${{ matrix.goarch }}
    runs-on: ${{ matrix.os }}
    env:
      # Resolves to "true" only when the macOS signing secrets are configured.
      HAS_SIGNING: ${{ secrets.APPLE_CERT_P12_BASE64 != '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14        # Apple Silicon
            target: darwin
            goarch: arm64
          - os: macos-13        # Intel
            target: darwin
            goarch: amd64
          - os: ubuntu-latest   # x86_64
            target: linux
            goarch: amd64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      # getlantern/systray uses CGO (Cocoa on macOS, GTK + AppIndicator on
      # Linux), so we build natively per OS/arch — no cross-compilation.
      - name: Install Linux build deps
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc libgtk-3-dev libayatana-appindicator3-dev

      - name: Resolve version
        id: ver
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build
        env:
          CGO_ENABLED: 1
        run: go build -ldflags "-s -w" -o portman ./cmd/portman

      - name: Stage raw binary (consumed by npm & Homebrew)
        shell: bash
        run: |
          mkdir -p dist
          cp portman "dist/portman-${{ matrix.target }}-${{ matrix.goarch }}"

      - name: Package .app (macOS)
        if: matrix.target == 'darwin'
        run: bash build/macos/make-bundle.sh ./portman "${{ steps.ver.outputs.version }}"

      # Sign + notarize only when the Apple secrets are configured; otherwise
      # the unsigned .app from the previous step ships as-is.
      - name: Sign & notarize (macOS)
        if: matrix.target == 'darwin' && env.HAS_SIGNING == 'true'
        env:
          APPLE_CERT_P12_BASE64: ${{ secrets.APPLE_CERT_P12_BASE64 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          bash build/macos/sign-notarize.sh "dist/Port Manager.app"
          # Replace the unsigned zip with the signed + stapled bundle.
          rm -f "dist/PortManager-macos-${{ matrix.goarch }}.zip"
          ( cd dist && ditto -c -k --keepParent "Port Manager.app" "PortManager-macos-${{ matrix.goarch }}.zip" )

      - name: Package tarball (Linux)
        if: matrix.target == 'linux'
        run: |
          mkdir -p dist/portman
          cp portman assets/icon.png build/linux/portman.desktop build/linux/install.sh dist/portman/
          chmod +x dist/portman/install.sh
          ( cd dist && tar czf portman-linux-amd64.tar.gz portman && rm -rf portman )

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.target }}-${{ matrix.goarch }}
          path: dist/*

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Flatten + checksums
        run: |
          mkdir -p release
          find artifacts -type f -exec cp {} release/ \;
          ( cd release && sha256sum * > checksums.txt )
          ls -la release
      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
